name: One-time balance sheet tree update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tree:
    if: ${{ !contains(github.event.head_commit.message, 'chore: expand balance sheet hierarchy defaults') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update account tree defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/workspace/financial-statements/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''function AccountTree({ accounts }: { accounts: AccountLine[] }) {
  const byParent = useMemo(() => { const map = new Map<string | null, AccountLine[]>(); for (const account of accounts) { const parent = account.parent_account_id ?? null; const list = map.get(parent) || []; list.push(account); map.set(parent, list); } for (const list of map.values()) list.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true })); return map; }, [accounts]);
  const visibleIds = useMemo(() => new Set(accounts.map(a => a.id)), [accounts]);
  const parentIds = useMemo(() => new Set(accounts.map(a => a.parent_account_id).filter(Boolean) as string[]), [accounts]);
  const [collapsed, setCollapsed] = useState<Set<string>>(new Set());
  // Default view shows only the main account rows; children open from the arrow.
  useEffect(() => { setCollapsed(new Set(parentIds)); }, [parentIds]);'''
          new = '''function AccountTree({ accounts, defaultExpandedLevels = 1 }: { accounts: AccountLine[]; defaultExpandedLevels?: number }) {
  const byParent = useMemo(() => { const map = new Map<string | null, AccountLine[]>(); for (const account of accounts) { const parent = account.parent_account_id ?? null; const list = map.get(parent) || []; list.push(account); map.set(parent, list); } for (const list of map.values()) list.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true })); return map; }, [accounts]);
  const visibleIds = useMemo(() => new Set(accounts.map(a => a.id)), [accounts]);
  const defaultCollapsedIds = useMemo(() => {
    const result = new Set<string>();
    const visit = (parentId: string | null, semanticLevel: number) => {
      for (const account of byParent.get(parentId) || []) {
        const children = (byParent.get(account.id) || []).filter(c => visibleIds.has(c.id));
        if (children.length > 0 && semanticLevel >= defaultExpandedLevels) result.add(account.id);
        if (children.length > 0) visit(account.id, semanticLevel + 1);
      }
    };
    visit(null, 1);
    return result;
  }, [byParent, visibleIds, defaultExpandedLevels]);
  const [collapsed, setCollapsed] = useState<Set<string>>(new Set());
  useEffect(() => { setCollapsed(defaultCollapsedIds); }, [defaultCollapsedIds]);'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          old2 = '<AccountTree accounts={assets} />'
          new2 = '<AccountTree accounts={assets} defaultExpandedLevels={3} />'
          old3 = '<AccountTree accounts={liabilities} />'
          new3 = '<AccountTree accounts={liabilities} defaultExpandedLevels={3} />'
          old4 = '<AccountTree accounts={equity} />'
          new4 = '<AccountTree accounts={equity} defaultExpandedLevels={3} />'
          for a,b in ((old2,new2),(old3,new3),(old4,new4)):
              if a not in s:
                  raise SystemExit(f'target render not found: {a}')
              s = s.replace(a,b,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/workspace/financial-statements/page.tsx
          git commit -m 'chore: expand balance sheet hierarchy defaults'
          git rm .github/workflows/one-time-balance-sheet-tree.yml
          git commit -m 'chore: remove one-time balance sheet tree updater'
          git push
